[project]
name = "event-analytics"
version = "0.1.0"
description = "Real-time product analytics: high-throughput event ingestion, stream processing and analytical queries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # <2.1: opentelemetry-instrumentation-sqlalchemy does not support 2.1 yet
    # (learned in the ledger project; tracing arrives in Phase 5).
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "structlog>=24.4",
    "aiokafka>=0.11",
    "orjson>=3.10",
    "clickhouse-connect[async]>=0.8",  # [async] pulls in aiohttp for the async client
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
