name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    name: Tests (real Postgres, Redpanda, ClickHouse, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: analytics
          CLICKHOUSE_PASSWORD: analytics
          CLICKHOUSE_DB: analytics
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user analytics --password analytics -q 'SELECT 1'"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://analytics:analytics@localhost:5433/analytics
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092
      ENVIRONMENT: test
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      # Service containers can't take a start command, so Redpanda runs via docker run.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v25.2.9 \
            redpanda start --mode=dev-container --smp=1 --memory=512M \
            --kafka-addr=external://0.0.0.0:19092 --advertise-kafka-addr=external://localhost:19092
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health -X brokers=localhost:19092 | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          docker logs redpanda; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrations round-trip and drift check
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - run: pytest -v

  observability-config:
    name: Validate Prometheus config & alerts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/prometheus:/p:ro"
          prom/prometheus:v3.5.0 check config /p/prometheus.yml

  helm:
    name: Helm chart lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/event-analytics
      - name: Render with production and kind values (incl. KEDA ScaledObject)
        run: |
          helm template analytics deploy/helm/event-analytics --api-versions keda.sh/v1alpha1 > /dev/null
          helm template analytics deploy/helm/event-analytics -f deploy/k8s/values-kind.yaml \
            --api-versions keda.sh/v1alpha1 | grep -q "kind: ScaledObject"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t event-analytics:ci .
