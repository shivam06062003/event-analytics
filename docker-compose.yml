# Host ports differ from the ledger project (Postgres 5433, API 8001) so both
# stacks can run side by side if needed.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://analytics:analytics@postgres:5432/analytics
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  CLICKHOUSE_HOST: clickhouse
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  QUOTA_ENABLED: ${QUOTA_ENABLED:-true}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Kafka-API-compatible broker: one binary, no ZooKeeper/KRaft controller to
  # run, and a small memory footprint. 2 cores / 1GB by default: with 1 core /
  # 512MB it became the ingestion bottleneck under load (see ADR 0005).
  redpanda:
    image: redpandadata/redpanda:v25.2.9
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=${REDPANDA_CORES:-2}
      - --memory=${REDPANDA_MEMORY:-1G}
      - --default-log-level=warn
      # Two listeners: containers use redpanda:9092, the host (tests) uses localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Column-oriented analytics database for events. Capped for an 8GB laptop
  # via clickhouse/config.d/low-memory.xml.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (used by the Python client)
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "analytics", "--password", "analytics", "-q", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The processor's dedup window (recently stored event_ids).
  redis:
    image: redis:7.4-alpine
    ports:
      - "6381:6379"   # 6381: avoids local Redis instances on 6379/6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-off: Postgres migrations, Kafka topics, ClickHouse migrations: all
  # infrastructure as code, applied before anything starts.
  migrate:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.cli ensure-topics && python -m app.cli clickhouse-migrate
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: event-api
      # Python runs one thread at a time per process: use several processes.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Kafka -> ClickHouse. Scale with `docker compose up -d --scale processor=3`
  # (useful up to one replica per partition: 6).
  processor:
    build: .
    command: ["python", "-m", "app.processor"]
    restart: unless-stopped
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: event-processor
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/processor-heartbeat') > 30)"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional web UI for browsing topics and messages: `make console` -> :8081
  console:
    profiles: [tools]
    image: redpandadata/console:v3.2.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ---- Observability (optional): `make observability` ----------------------
  # Host ports differ from the ledger project's (9090/3001/16686) so both
  # stacks can run side by side.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9091:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "16687:16686"

volumes:
  pgdata:
  redpanda:
  clickhouse:
