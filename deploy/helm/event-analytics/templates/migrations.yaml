{{- if .Values.migrations.enabled }}
{{- /*
Migrations run as a Helm HOOK: before install and before every upgrade, and
the release proceeds only if the Job succeeds, so new pods never start
against an old schema.

Gotcha: hooks run BEFORE the chart's regular resources exist, so the Job
can't use the release ConfigMap/Secret. It gets its own hook-scoped copies
(weight -10: created first; deleted once the hook succeeds).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-migrations-env
  labels: {{- include "ea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations
  labels: {{- include "ea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "ea.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      {{- include "ea.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "ea.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Postgres schema, Kafka topics, ClickHouse schema: all as code.
          command:
            - sh
            - -c
            - alembic upgrade head && python -m app.cli ensure-topics && python -m app.cli clickhouse-migrate
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-migrations-env
          {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- include "ea.containerSecurity" . | nindent 10 }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
